name: Genesis CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
      - name: Validate registries
        shell: pwsh
        run: ./tools/validate_registry.ps1
      - name: Secret scan
        shell: pwsh
        run: ./tools/secret_scan.ps1

